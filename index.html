<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مباريات اليوم</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #e50914;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
    }

    .match {
      background: #222;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
    }

    .teams {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .time {
      color: #ccc;
      margin-bottom: 15px;
    }

    .watch {
      display: inline-block;
      background: #e50914;
      color: white;
      text-decoration: none;
      padding: 10px 25px;
      border-radius: 8px;
    }

    .watch:hover {
      background: #b20710;
    }
  </style>
</head>

<body>

<header>
  ⚽ مباريات اليوم
</header>

<div class="container">

  <div class="match">
    <div class="teams">الفريق الأول × الفريق الثاني</div>
    <div class="time">20:00</div>
    <a class="watch" href="#">مشاهدة المباراة</a>
  </div>

  <div class="match">
    <div class="teams">الفريق الثالث × الفريق الرابع</div>
    <div class="time">22:00</div>
    <a class="watch" href="#">مشاهدة المباراة</a>
  </div>

</div>

</body>
</html>
